[project]
name = "athenax"
version = "1.0.0"
description = "AthenaX — Open GovTech Intelligence & Policy Experimentation (backend + services)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
testpaths = ["apps/api/tests", "services/tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".git", ".next", "node_modules", "__pycache__", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
